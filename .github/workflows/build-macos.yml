name: Build and release macOS DMGs

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "AetherApp/**"
      - "project.yml"
      - ".github/workflows/build-macos.yml"
      - "README.md"

concurrency:
  group: aether-macos-build
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
            aether_asset: aether-macos-arm64.tar.gz
          - runner: macos-15-intel
            arch: x86_64
            aether_asset: aether-macos-x86_64.tar.gz

    runs-on: ${{ matrix.runner }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install tooling
        run: |
          brew install xcodegen create-dmg
          xcodegen version
          create-dmg --version || true

      - name: Download and verify bundled Aether binary
        env:
          AETHER_ASSET: ${{ matrix.aether_asset }}
        run: |
          mkdir -p AetherApp/Resources/aether_app_bin
          curl -fsSL -o aether.tar.gz \
            "https://github.com/CluvexStudio/Aether/releases/download/v1.6.0/$AETHER_ASSET"
          curl -fsSL -o aether.sha256 \
            "https://github.com/CluvexStudio/Aether/releases/download/v1.6.0/$AETHER_ASSET.sha256"

          expected="$(awk '{print $1}' aether.sha256)"
          actual="$(shasum -a 256 aether.tar.gz | awk '{print $1}')"
          test "$expected" = "$actual"

          tar -xzf aether.tar.gz -C AetherApp/Resources/aether_app_bin
          mv AetherApp/Resources/aether_app_bin/aether AetherApp/Resources/aether
          chmod +x AetherApp/Resources/aether
          file AetherApp/Resources/aether

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build
        run: |
          xcodebuild \
            -project AetherApp.xcodeproj \
            -scheme AetherApp \
            -configuration Release \
            -derivedDataPath build \
            ONLY_ACTIVE_ARCH=YES \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            build

      - name: Locate built app
        id: app
        shell: bash
        run: |
          APP="$(find build -name "AetherApp.app" -type d | head -n1)"
          test -n "$APP"
          echo "path=$APP" >> "$GITHUB_OUTPUT"
          echo "Built: $APP"
          file "$APP/Contents/MacOS/AetherApp"

      - name: Sign
        env:
          DEV_ID: ${{ secrets.MACOS_SIGN_IDENTITY }}
        run: |
          APP="${{ steps.app.outputs.path }}"
          if [ -n "$DEV_ID" ]; then
            codesign --force --deep --options runtime \
              --entitlements AetherApp/Resources/entitlements.mac \
              --sign "$DEV_ID" "$APP"
          else
            codesign --force --deep --options runtime \
              --entitlements AetherApp/Resources/entitlements.mac \
              -s - "$APP"
          fi
          codesign --verify --deep --strict "$APP"

      - name: Create DMG
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          APP="${{ steps.app.outputs.path }}"
          create-dmg \
            --volname "Aether" \
            --window-pos 200 120 \
            --window-size 500 300 \
            --icon "AetherApp.app" 125 135 \
            --hide-extension "AetherApp.app" \
            --app-drop-link 375 135 \
            "Aether-$ARCH.dmg" "$APP"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Aether-macOS-${{ matrix.arch }}
          path: |
            Aether-${{ matrix.arch }}.dmg
            ${{ steps.app.outputs.path }}
          retention-days: 90

  release:
    name: Publish release
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Read version and detect version bump
        id: version
        shell: bash
        run: |
          VERSION="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' AetherApp/Resources/Info.plist 2>/dev/null || true)"
          if [ -z "$VERSION" ]; then
            VERSION="$(grep -A1 'CFBundleShortVersionString' AetherApp/Resources/Info.plist | tail -n1 | sed 's/.*<string>\(.*\)<\/string>.*/\1/')"
          fi
          test -n "$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

          if gh release view "v$VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "needed=false" >> "$GITHUB_OUTPUT"
          else
            echo "needed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Download build artifacts
        if: steps.version.outputs.needed == 'true'
        uses: actions/download-artifact@v4
        with:
          pattern: Aether-macOS-*
          path: dist
          merge-multiple: false

      - name: Create GitHub release
        if: steps.version.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          mapfile -t DMGS < <(find dist -type f -name '*.dmg' | sort)
          test "${#DMGS[@]}" -eq 2

          gh release create "v$VERSION" "${DMGS[@]}" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Aether macOS v$VERSION" \
            --generate-notes
