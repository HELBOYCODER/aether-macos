name: AetherApp
options:
  bundleIdPrefix: com.cluvex.aether
  createIntermediateGroups: true
targets:
  AetherApp:
    type: application
    platform: macOS
    deploymentTarget: "13.0"
    sources:
      - path: Sources
      - path: Resources
        buildPhase: resources
    resources:
      - path: Resources/Assets.xcassets
      - path: Resources/aether
        buildPhase: resources
    info:
      CFBundleDisplayName: Aether
      CFBundleName: Aether
      LSUIElement: true            # menu-bar app, no Dock icon
      LSMinimumSystemVersion: "13.0"
      CFBundleExecutable: AetherApp
      NSMainNibFile: ""
      NSPrincipalClass: NSApplication
      NSHumanReadableCopyright: "Aether client UI wrapper — AGPL-3.0"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.cluvex.aether
        CODE_SIGN_ENTITLEMENTS: Resources/entitlements.mac
        ENABLE_HARDENED_RUNTIME: true
        INFOPLIST_FILE: Resources/Info.plist
        SWIFT_VERSION: "5.9"
        MACOSX_DEPLOYMENT_TARGET: "13.0"
        COMBINE_HIDPI_IMAGES: true
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        RUN_DOCUMENTATION_COMPILER: false
